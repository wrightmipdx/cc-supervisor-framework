name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax
        run: |
          for f in install.sh .claude/install-check.sh .claude/hooks/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Shellcheck
        run: shellcheck -S warning install.sh .claude/install-check.sh .claude/hooks/*.sh

      - name: Commit-gate behavior
        run: .claude/hooks/test-commit-gate.sh

      - name: Wiring — no dangling agent, skill or path references
        run: .claude/install-check.sh --static

  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [node, python, rust-go, none]
    steps:
      - uses: actions/checkout@v5

      # The real test: a fresh install must produce a repo that passes its own
      # wiring check. install.sh runs --static itself and exits non-zero on
      # failure, so a dangling reference fails the build here.
      - name: Install into a fresh repo
        run: |
          mkdir -p "$RUNNER_TEMP/fresh" && git -C "$RUNNER_TEMP/fresh" init -q
          ./install.sh "$RUNNER_TEMP/fresh" --stack ${{ matrix.stack }}

      # Re-running is the upgrade path. It must be idempotent: no .new files,
      # and exactly one copy of the constitution.
      - name: Re-install is idempotent
        run: |
          ./install.sh "$RUNNER_TEMP/fresh" --stack ${{ matrix.stack }} | tee "$RUNNER_TEMP/second.log"
          if grep -q '\.new' "$RUNNER_TEMP/second.log"; then
            echo "re-install produced .new files; it is not idempotent"; exit 1
          fi
          n=$(grep -c 'BEGIN SUPERVISOR FRAMEWORK' "$RUNNER_TEMP/fresh/CLAUDE.md")
          [ "$n" -eq 1 ] || { echo "constitution appears $n times"; exit 1; }

      # The collision case: a repo that already has its own CLAUDE.md and
      # settings.json must keep both.
      - name: Existing files survive
        run: |
          mkdir -p "$RUNNER_TEMP/occupied/.claude" && git -C "$RUNNER_TEMP/occupied" init -q
          printf '# House rules\n\nNever touch the vendor directory.\n' > "$RUNNER_TEMP/occupied/CLAUDE.md"
          printf '{"permissions":{"allow":["Bash(make:*)"]}}\n' > "$RUNNER_TEMP/occupied/.claude/settings.json"
          ./install.sh "$RUNNER_TEMP/occupied" --stack ${{ matrix.stack }}
          grep -q 'Never touch the vendor directory.' "$RUNNER_TEMP/occupied/CLAUDE.md" \
            || { echo "clobbered the project's own CLAUDE.md"; exit 1; }
          grep -q 'BEGIN SUPERVISOR FRAMEWORK' "$RUNNER_TEMP/occupied/CLAUDE.md" \
            || { echo "did not append the framework block"; exit 1; }
          grep -q 'Bash(make:\*)' "$RUNNER_TEMP/occupied/.claude/settings.json" \
            || { echo "clobbered the project's own settings.json"; exit 1; }
          test -f "$RUNNER_TEMP/occupied/.claude/settings.json.new" \
            || { echo "no merged settings written for review"; exit 1; }

  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The test that was missing: install an OLD release, then upgrade to HEAD.
      # Re-running the same version is idempotence, not upgrade, and the two
      # look alike right up until an upgrade silently fails to land.
      - name: Migrate a pre-manifest install, then upgrade
        run: |
          set -e
          OLD=aebe445   # last release before manifests existed
          T="$RUNNER_TEMP/legacy"
          mkdir -p "$T" && git -C "$T" init -q
          git archive "$OLD" | tar -x -C "$T"
          printf 'node_modules\n' > "$T/.gitignore"
          echo '{}' > "$T/package.json"

          # Without --adopt it must refuse rather than guess.
          if ./install.sh "$T" >/dev/null 2>&1; then
            echo "installer did not refuse a pre-manifest repo"; exit 1
          fi

          ./install.sh "$T" --adopt

          # 1. exactly one constitution, and it is the new one
          [ "$(grep -c '^# SUPERVISOR' "$T/CLAUDE.md")" -eq 1 ] || { echo "not exactly one constitution"; exit 1; }
          grep -q 'Volume decides whether to delegate' "$T/CLAUDE.md" || { echo "new prime rule 1 missing"; exit 1; }
          grep -q 'Judge, do not type' "$T/CLAUDE.md" && { echo "old prime rule 1 still present"; exit 1; }

          # 2. files removed upstream are gone, and nothing still wires them
          for gone in .claude/agents/explore.md .claude/hooks/40-supervisor-budget.sh; do
            [ -e "$T/$gone" ] && { echo "$gone survived the upgrade"; exit 1; }
          done
          grep -q '40-supervisor-budget' "$T/.claude/settings.json" && { echo "stale hook still wired"; exit 1; }

          # 3. the repaired hook is the LIVE one, not sitting in .new
          printf '%s' '{"session_id":"t","tool_input":{"command":"git add .gitignore"}}' > "$RUNNER_TEMP/p.json"
          if bash "$T/.claude/hooks/30-commit-gate.sh" < "$RUNNER_TEMP/p.json" | grep -q deny; then
            echo "upgrade did not land: the old commit gate is still live"; exit 1
          fi

          # 4. a clean upgrade leaves no manual merges
          n=$(find "$T" -name '*.new' | wc -l)
          [ "$n" -eq 0 ] || { echo "$n .new file(s) after a clean upgrade"; exit 1; }

          # 5. the repo's own content survived
          grep -q node_modules "$T/.gitignore" || { echo "clobbered .gitignore"; exit 1; }

      # Regression: --adopt once inferred "what the last release installed" from
      # every file in the directories it owns. .claude/agents/ and
      # .claude/skills/ are shared with the consumer's own agents and skills, so
      # that inference deleted their work.
      - name: --adopt never deletes the consumer's own agents, skills or hooks
        run: |
          set -e
          T="$RUNNER_TEMP/theirs"
          mkdir -p "$T" && git -C "$T" init -q
          git archive aebe445 | tar -x -C "$T"
          printf -- '---\nname: dba\ndescription: ours\nmodel: sonnet\n---\nHouse rules.\n' > "$T/.claude/agents/dba.md"
          mkdir -p "$T/.claude/skills/deploy"
          printf -- '---\nname: deploy\ndescription: ours\n---\nStep 1.\n' > "$T/.claude/skills/deploy/SKILL.md"
          printf '#!/usr/bin/env bash\necho ours\n' > "$T/.claude/hooks/60-notify-slack.sh"

          ./install.sh "$T" --adopt

          for mine in .claude/agents/dba.md .claude/skills/deploy/SKILL.md .claude/hooks/60-notify-slack.sh; do
            [ -f "$T/$mine" ] || { echo "--adopt deleted the consumer's $mine"; exit 1; }
          done
          # and it still removes what the framework actually retired
          for gone in .claude/agents/explore.md .claude/hooks/40-supervisor-budget.sh; do
            [ -e "$T/$gone" ] && { echo "$gone not removed"; exit 1; }
          done
          echo ok

      - name: A customized framework file is never overwritten
        run: |
          set -e
          T="$RUNNER_TEMP/custom"
          mkdir -p "$T" && git -C "$T" init -q
          ./install.sh "$T" --stack none >/dev/null
          printf '\n- Local rule.\n' >> "$T/.claude/agents/scout.md"
          jq '.permissions.allow += ["Bash(make:*)"]' "$T/.claude/settings.json" > "$T/s" && mv "$T/s" "$T/.claude/settings.json"
          ./install.sh "$T" --stack none
          grep -q 'Local rule' "$T/.claude/agents/scout.md" || { echo "overwrote a local edit"; exit 1; }
          grep -q 'Bash(make:\*)' "$T/.claude/settings.json" || { echo "destroyed customized settings.json"; exit 1; }
          test -f "$T/.claude/agents/scout.md.new" || { echo "no .new offered for the conflict"; exit 1; }
          ./install.sh "$T" --stack none --force >/dev/null
          grep -q 'Local rule' "$T/.claude/agents/scout.md" && { echo "--force did not overwrite"; exit 1; }
          echo "ok"
